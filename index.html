<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StudyAbroad</title>
<meta name="description" content="เตรียมตัวไปเรียนภาษา 1 ปี: ไทม์ไลน์ เอกสาร งบประมาณ เช็กลิสต์หลังถึง ตารางเรียน การ์ดฉุกเฉิน ใช้งานออฟไลน์ได้">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --soft:#f4f6f9; --soft2:#e9edf3; --line:#e3e7ee; --line2:#cfd6e0;
  --ink:#16202e; --ink2:#4a5768; --ink3:#8691a1;
  --acc:#2c56c9; --acc-soft:#e7edfb; --acc-ink:#1f40a0;
  --good:#16834a; --good-soft:#e5f5ec; --warn:#b86200; --warn-soft:#fff3e0; --bad:#cf3434; --bad-soft:#fdecec;
  --f-body:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,monospace;
  --r:14px; --rs:10px; --nav:64px; color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f-body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 28px);-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--acc)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);width:100%;background:#fff;border:1px solid var(--line2);border-radius:var(--rs);padding:10px 12px;outline:none;min-height:44px}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2);font-weight:500}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
h1{font-size:21px;line-height:1.25}
h2{font-size:15px;font-weight:700}
.muted{color:var(--ink3);font-size:13px}
.small{font-size:12.5px}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g3 .btn{padding:0 6px;font-size:13px}
details.card>summary{list-style:none;cursor:pointer;font-weight:700;display:flex;justify-content:space-between;gap:8px}
details.card>summary::after{content:"▾";color:var(--ink3)}
details.card[open]>summary::after{content:"▴"}
.season{border-left:4px solid var(--line2);padding-left:10px}
.season.now{border-color:var(--acc)}
.stack>*+*{margin-top:10px}

.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px 16px;display:flex;align-items:center;gap:6px}
.logo{font-weight:700;font-size:17px;letter-spacing:-.3px;white-space:nowrap}.logo b{color:var(--acc)}
#topSub{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex-shrink:0}.ib:active{background:var(--soft)}
.sosb{font-size:12px;font-weight:700;color:#fff;background:var(--bad);width:auto;padding:0 10px;height:32px;border-radius:99px}
#menu{position:absolute;right:8px;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(20,32,48,.16);padding:6px;min-width:240px}
#menu button{display:flex;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:9px;font-size:14.5px}#menu button:active{background:var(--soft)}
#menu .ft{font-size:11.5px;color:var(--ink3);padding:8px 12px 4px;border-top:1px solid var(--line);margin-top:4px}

main{max-width:720px;margin:0 auto;padding:16px}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.soft{background:var(--soft);border-color:transparent}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14.5px;background:var(--soft);white-space:nowrap}
.btn:active{filter:brightness(.95)}
.btn.pri{background:var(--acc);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.full{width:100%}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--soft2);color:var(--ink2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--acc-soft);color:var(--acc-ink)}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px;background:var(--warn-soft);color:#6b3a00;margin-bottom:12px}
.note.info{background:var(--acc-soft);color:var(--acc-ink)}
.note.bad{background:var(--bad-soft);color:#7a1d1d}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* hero */
.hero{background:linear-gradient(135deg,#2c56c9,#3f6fe6);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
.hero .big{font-family:var(--f-num);font-size:40px;font-weight:600;line-height:1.1}
.hero .muted{color:rgba(255,255,255,.8)}
.hero .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hero .chips span{background:rgba(255,255,255,.18);border-radius:99px;padding:3px 10px;font-size:12.5px}

/* list rows */
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:none}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--line2);flex-shrink:0;display:grid;place-items:center;font-size:15px;color:#fff;margin-top:1px}
.ck.on{background:var(--good);border-color:var(--good)}
.li .t{font-weight:600;font-size:14.5px}
.li.done .t{color:var(--ink3);text-decoration:line-through}
.li .x{font-size:13px;color:var(--ink2)}
.li .d{font-size:12px;color:var(--ink3);white-space:nowrap;text-align:right}
.li .d.late{color:var(--bad);font-weight:600}
.li .d.soon{color:var(--warn);font-weight:600}
.lnk{font-size:12.5px;display:inline-block;margin-top:2px}
.prog{height:8px;background:var(--soft2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);border-radius:99px}
.prog.over i{background:var(--bad)}

/* money */
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi>div{background:var(--soft);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-family:var(--f-num);font-size:18px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
.bars i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.bars i.neg{background:var(--bad)}
.bars i.act{background:#1d8f5a}
.bars small{font-size:10px;color:var(--ink3);font-family:var(--f-num)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-weight:600;color:var(--ink2);font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.r,table.t th.r{text-align:right}
.tx{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.tx:first-child{border-top:none}
.tx .ic{width:34px;height:34px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex-shrink:0}

/* docs */
.doc{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.doc:first-child{border-top:none}
.thumb{width:52px;height:52px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:22px;flex-shrink:0;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.files .f{position:relative;width:70px;height:70px;border-radius:10px;background:var(--soft);overflow:hidden;display:grid;place-items:center;font-size:12px;text-align:center}
.files .f img{width:100%;height:100%;object-fit:cover}
.files .f .rm{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;font-size:12px}

/* schedule */
.day{margin-bottom:10px}
.day h3{font-size:13px;color:var(--ink2);margin-bottom:4px}
.cls{display:flex;gap:10px;align-items:center;background:var(--acc-soft);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.cls .tm{font-family:var(--f-num);font-size:12.5px;color:var(--acc-ink);white-space:nowrap}

/* sos */
.em{display:flex;gap:8px;flex-wrap:wrap}
.em a{flex:1;min-width:120px;text-align:center;text-decoration:none;font-weight:700;font-size:18px;background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:12px 8px}
.tel{font-weight:600;text-decoration:none;font-family:var(--f-num);font-size:14px}
.phr{padding:8px 0;border-top:1px solid var(--line)}.phr:first-child{border-top:none}
.phr b{display:block;font-size:17px}

/* nav */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bn button{flex:1;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--ink3);font-weight:600}
nav.bn button .i{font-size:20px;line-height:1;filter:grayscale(1);opacity:.7}
nav.bn button.on{color:var(--acc)}
nav.bn button.on .i{filter:none;opacity:1}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(15,22,33,.42);z-index:90}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:91;background:#fff;border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.15)}
.sh{position:sticky;top:0;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;z-index:2}
.sh b{font-size:16px}
.xb{width:36px;height:36px;border-radius:99px;background:var(--soft);font-size:15px;flex-shrink:0}
.sf{display:flex;gap:8px;position:sticky;bottom:0;background:#fff;padding-top:12px;margin-top:6px}
.sf .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);background:#1d2633;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:120;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.bad{background:var(--bad)}
.empty{text-align:center;color:var(--ink3);padding:22px 8px;font-size:14px}
.cmp{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cmp table{min-width:520px}
.src{font-size:12px;color:var(--ink3);margin-top:6px}
.tog{display:flex;align-items:center;gap:10px;font-size:14px;padding:6px 0}
.tog input{width:22px;height:22px;min-height:0;flex-shrink:0}
.fab{position:fixed;right:16px;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 14px);z-index:55;width:56px;height:56px;border-radius:18px;background:var(--acc);color:#fff;font-size:28px;box-shadow:0 8px 20px rgba(44,86,201,.35)}
@media (min-width:600px){.kpi{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">Study<b>Abroad</b></div>
  <div id="topSub"></div>
  <button class="ib sosb" data-act="go" data-v="sos" aria-label="การ์ดฉุกเฉิน">SOS</button>
  <div style="position:relative">
    <button class="ib" data-act="menu" aria-label="เมนู">☰</button>
    <div id="menu" hidden>
      <button data-act="go" data-v="rules">📜 กฎที่นักเรียนต้องรู้</button>
      <button data-act="go" data-v="know">⚠️ ข้อควรระวัง & ข้อควรรู้</button>
      <button data-act="go" data-v="schools">🏫 เทียบโรงเรียน</button>
      <button data-act="go" data-v="fx">💱 อัตราแลกเปลี่ยน</button>
      <button data-act="go" data-v="line">🔔 แจ้งเตือนผ่าน LINE</button>
      <button data-act="go" data-v="compare">⚖️ เทียบ 3 ประเทศ</button>
      <button data-act="go" data-v="sos">🆘 การ์ดฉุกเฉิน</button>
      <button data-act="setup">⚙️ ตั้งค่าแผน (ประเทศ วันเดินทาง เงิน)</button>
      <button data-act="ics">📅 ส่งออกปฏิทิน (.ics)</button>
      <button data-act="backup">💾 สำรองข้อมูล (.json)</button>
      <button data-act="restore">📂 กู้คืนจากไฟล์</button>
      <button data-act="install" id="installBtn" hidden>📲 ติดตั้งเป็นแอป</button>
      <div class="ft">ข้อมูลกฎ/ตัวเลข ณ <span id="asof"></span> · ข้อมูลของคุณอยู่ในเครื่องนี้เท่านั้น</div>
    </div>
  </div>
</header>
<main id="app"></main>
<nav class="bn">
  <button data-act="go" data-v="home"><span class="i">🏠</span>หน้าแรก</button>
  <button data-act="go" data-v="plan"><span class="i">🗓️</span>ไทม์ไลน์</button>
  <button data-act="go" data-v="money"><span class="i">💰</span>งบ</button>
  <button data-act="go" data-v="docs"><span class="i">📄</span>เอกสาร</button>
  <button data-act="go" data-v="life"><span class="i">🎒</span>ชีวิต</button>
</nav>
<div id="scrim" hidden data-act="closeSheet"></div>
<div id="sheet" hidden role="dialog" aria-modal="true"></div>
<div id="toast" hidden></div>
<input type="file" id="fileRestore" accept=".json,application/json" hidden>
<input type="file" id="fileDoc" accept="image/*,application/pdf" multiple hidden>

<script src="countries.js"></script>
<script>
'use strict';
/* ============ UTIL ============ */
const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? n : 0; };
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayIso = () => iso(new Date());
const parseD = s => s ? new Date(s + 'T00:00') : null;
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return iso(d); };
const addMonths = (s, n) => { const d = parseD(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate())); return iso(d); };
const dDiff = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_D = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const fd = s => { if (!s) return '—'; const d = parseD(s); return `${d.getDate()} ${TH_M[d.getMonth()]} ${String(d.getFullYear()+543).slice(2)}`; };
const fm = s => { const d = parseD(s); return `${TH_M[d.getMonth()]} ${String(d.getFullYear()+543).slice(2)}`; };
const n0 = n => Math.round(n).toLocaleString('th-TH');
const thb = n => (n < 0 ? '−' : '') + '฿' + n0(Math.abs(n));
const money = (n, c) => c === 'THB' ? thb(n) : (n < 0 ? '−' : '') + (CURR[c]?.s || c + ' ') + n0(Math.abs(n));

/* ============ STATE ============ */
const KEY = 'studyabroad.v1', RKEY = 'studyabroad.rates';
const blankSos = () => ({name:'', addr:'', school:'', schoolPhone:'', insurer:'', policy:'', insPhone:'', blood:'', allergy:'', meds:'', contacts:[{name:'', phone:''},{name:'', phone:''}]});
const blank = () => ({v:1, setup:false, country:'AU', visa:'student', city:'syd', depart:'', months:12, weeks:44, savings:0, income:0, flight:28000, pay:'upfront',
  work:{wage:'', casual:true, hoursW:0, tax:'', mode:'calc'}, shifts:[], schools:[], rooms:[], schoolId:null, roomId:null, rateHist:{}, rateTarget:null, pack:{}, packCustom:[], line:{url:'', secret:'', on:false, lastSync:null, sig:''},
  over:{}, tasks:{}, taskDate:{}, custom:[], arrival:{}, docs:[], tx:[], classes:[], events:[], sos:blankSos(), rateOver:{}, lastBackup:null, created:todayIso()});
let db = blank();
let rates = {rates:{}, at:null};
const ui = {view:'home', planTab:'before', moneyTab:'plan', lifeTab:'week', txMonth:null, fxC:null, knowTab:'caution'};
let S = null, deferredPrompt = null;

function load(){
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.v) { db = Object.assign(blank(), d); if (!d.work && num(d.income) > 0) db.work.mode = 'manual'; } } catch {}
  db.sos = Object.assign(blankSos(), db.sos || {});
  fixDb();
  try { const r = JSON.parse(localStorage.getItem(RKEY)); if (r && r.rates) rates = r; } catch {}
}
function fixDb(){ db.work = Object.assign({wage:'', casual:true, hoursW:0, tax:'', mode:'calc'}, db.work || {});
  db.line = Object.assign({url:'', secret:'', on:false, lastSync:null, sig:''}, db.line || {}); db.pack ||= {}; for (const k of ['shifts','schools','rooms','packCustom']) if (!Array.isArray(db[k])) db[k] = []; db.rateHist ||= {}; }
function saveRaw(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch { toast('บันทึกไม่สำเร็จ พื้นที่ในเครื่องเต็ม', 'bad'); } }
function save(){ saveRaw(); lineSoon(); }

/* ============ FILES (IndexedDB) ============ */
const IDB = {
  d:null,
  open(){ if (this.d) return Promise.resolve(this.d);
    return new Promise((res, rej) => { const r = indexedDB.open('studyabroad', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('files');
      r.onsuccess = () => { this.d = r.result; res(this.d); }; r.onerror = () => rej(r.error); }); },
  async tx(mode, fn){ const d = await this.open(); return new Promise((res, rej) => {

/* planned net spend per month, in THB, with category detail */
function planMonths(){
  const r = rate(LC()), M = months(), sm = studyMonths(), tuition = cost('tuitionW') * studyWeeks();
  const out = [];
  for (let m = 0; m <= M; m++) {
    const it = {};
    if (m === 0) {
      it.visa = cost('fee') * r; it.ins = cost('ins') * M / 12 * r; it.tuition = cost('enrol') * r + (db.pay === 'upfront' ? tuition * r : 0); it.flight = num(db.flight);
    } else {
      it.rent = cost('rentW') * 52 / 12 * r; it.living = cost('livM') * r;
      if (m === 1) it.setup = cost('setupL') * r;
      if (db.pay === 'monthly' && m <= sm) it.tuition = tuition / sm * r;
      if (m >= 2 && canWork() && incomeL() > 0) it.income = -incomeL() * r;
    }
    for (const e of db.events) if (num(e.cost) > 0 && e.date) { const em = monthIdx(e.date); if (em === m) it.travel = (it.travel || 0) + num(e.cost) * rate(e.curr || LC()); }
    out.push({m, items:it, total:Object.values(it).reduce((s, x) => s + x, 0)});
  }

}
const txThb = t => num(t.amount) * (t.curr === 'THB' ? 1 : num(t.rate) || rate(t.curr));
function actualMonths(){

    bal -= used; rows.push({m:p.m, plan:p.total, act:a, used, bal, past:p.m < cm, cur:p.m === cm});
    if (bal >= 0 && firstNeg === null) lastOk = p.m; else if (bal < 0 && firstNeg === null) firstNeg = p.m;

const W = () => WORK[db.country];
const vk = () => V() === C().visas.whv ? 'whv' : 'student';
const rule = () => W().rule[vk()] || 'week';
const limitH = () => W().limit[vk()] ?? 0;
const canWork = () => rule() === 'none' || limitH() > 0;
const wageDef = () => { const w = W(), base = (w.cityWage && w.cityWage[db.city]) || w.minWage; return +(base * (1 + (db.work.casual && w.casual ? w.casual : 0))).toFixed(2); };
const wage = () => num(db.work.wage) || wageDef();
const taxDef = () => W().tax[vk()] ?? 15;
const taxPct = () => db.work.tax === '' || db.work.tax === undefined || db.work.tax === null ? taxDef() : num(db.work.tax);
const incomeCalcL = () => wage() * num(db.work.hoursW) * 52 / 12 * (1 - taxPct() / 100);
const incomeL = () => !canWork() ? 0 : db.work.mode === 'manual' ? num(db.income) : incomeCalcL();
const monOf = s => { const d = parseD(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); };
const inBreak = s => !!W().breakFree[vk()] && db.events.some(e => e.type === 'holiday' && e.date && s >= e.date && s <= (e.end || e.date));
const countH = sh => inBreak(sh.date) ? 0 : num(sh.hours);
const sumH = (a, b) => db.shifts.filter(s => s.date >= a && s.date <= b).reduce((t, s) => t + countH(s), 0);
const weekH = mon => sumH(mon, addDays(mon, 6));
function workStatus(){
  const r = rule(), L = limitH(), mon = monOf(todayIso());
  if (r === 'none') return {r, L};
  const wThis = weekH(mon);
  if (r === 'week') return {r, L, used:wThis, left:Math.max(0, L - wThis), mon};
  const wPrev = weekH(addDays(mon, -7)), wNext = weekH(addDays(mon, 7)), a = wPrev + wThis, b = wThis + wNext;
  return {r, L, used:Math.max(a, b), left:Math.max(0, Math.min(L - a, L - b)), wPrev, wThis, wNext, mon};
}
function violations(){
  const r = rule(), L = limitH(); if (r === 'none' || !db.shifts.length) return [];
  const len = r === 'fortnight' ? 13 : 6, seen = new Set(), out = [];
  for (const m of [...new Set(db.shifts.map(s => monOf(s.date)))].sort())
    for (const s of r === 'fortnight' ? [addDays(m, -7), m] : [m]) {
      if (seen.has(s)) continue; seen.add(s);
      const h = sumH(s, addDays(s, len)); if (L === 0 ? h > 0 : h > L) out.push({s, e:addDays(s, len), h});
    }
  return out;
}
function employerWarn(){
  const m = W().employerMax[vk()]; if (!m) return [];
  const by = {}; for (const s of db.shifts) (by[(s.employer || '').trim() || 'ไม่ระบุนายจ้าง'] ||= []).push(s.date);
  return Object.entries(by).map(([k, ds]) => { ds.sort(); const until = addMonths(ds[0], m); return {k, first:ds[0], until, left:dDiff(todayIso(), until), m}; })
    .filter(x => x.left <= 30 && dDiff(x.until, todayIso()) < 60);
}
const shiftPay = s => num(s.hours) * (num(s.rate) || wage());
const ruleTxt = () => rule() === 'fortnight' ? `${limitH()} ชม. ต่อ 2 สัปดาห์` : rule() === 'week' ? `${limitH()} ชม. ต่อสัปดาห์` : 'ไม่จำกัดชั่วโมง';

  const mStart = todayIso().slice(0, 8) + '01', mShifts = db.shifts.filter(s => s.date >= mStart && s.date <= todayIso()), gross = mShifts.reduce((t, s) => t + shiftPay(s), 0);
  h += `<div class="kpi"><div><span>รายได้เดือนนี้ (ก่อนภาษี)</span><b>${money(gross, lc)}</b></div><div><span>หลังหักภาษี ~${taxPct()}%</span><b style="color:var(--good)">${money(gross * (1 - taxPct()/100), lc)}</b></div></div>`;
  h += `<div class="card"><div class="ch"><h2>💵 รายได้ที่ใช้ในแผนงบ</h2><button class="btn sm pri" data-act="workSet">แก้ไข</button></div><table class="t">

/* ============ FX (อัตราแลกเปลี่ยน) ============ */
const hist = {};
async function loadHist(c){
  if (hist[c] && hist[c].at > Date.now() - 6 * 3600e3) return;
  if (!navigator.onLine) return;
  try {
    const start = addDays(todayIso(), -180), r = await fetch(`https://api.frankfurter.app/${start}..?from=${c}&to=THB`, {cache:'no-store'});
    if (!r.ok) return; const d = await r.json(); if (!d.rates) return;
    const pts = Object.entries(d.rates).map(([k, v]) => [k, v.THB]).filter(x => x[1]).sort((a, b) => a[0] < b[0] ? -1 : 1);
    hist[c] = {at:Date.now(), pts};
    const m = new Map((db.rateHist[c] || []).map(x => [x[0], x[1]])); for (const [k, v] of pts) m.set(k, v);
    db.rateHist[c] = [...m.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1).slice(-400); saveRaw();
    if (ui.view === 'fx') render();
  } catch {}
}
function pushRateHist(){ const t = todayIso(); for (const c of ['AUD','NZD','CAD']) { const v = (rates.rates || {})[c]; if (!v) continue; const a = (db.rateHist[c] ||= []); const i = a.findIndex(x => x[0] === t); if (i >= 0) a[i][1] = v; else a.push([t, v]); if (a.length > 400) a.splice(0, a.length - 400); } saveRaw(); }
function spark(pts, target){
  if (pts.length < 2) return `<div class="empty">ยังมีข้อมูลเรทย้อนหลังไม่พอ<br>ต่อเน็ตแล้วเปิดหน้านี้ แอปจะดึงเรทย้อนหลัง 6 เดือน</div>`;
  const W0 = 340, H0 = 120, vs = pts.map(p => p[1]).concat(target ? [target] : []), mn = Math.min(...vs), mx = Math.max(...vs), sp = (mx - mn) || 1;
  const x = i => i / (pts.length - 1) * W0, y = v => H0 - 6 - (v - mn) / sp * (H0 - 24);
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W0} ${H0}" style="width:100%;height:auto;display:block" role="img" aria-label="กราฟเรทย้อนหลัง">
    ${target ? `<line x1="0" x2="${W0}" y1="${y(target)}" y2="${y(target)}" stroke="#16834a" stroke-dasharray="4 4"/><text x="${W0 - 2}" y="${y(target) - 4}" text-anchor="end" font-size="10" fill="#16834a">เป้า ${target}</text>` : ''}
    <polyline points="${line}" fill="none" stroke="#2c56c9" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(pts.length - 1)}" cy="${y(pts[pts.length - 1][1])}" r="3.5" fill="#2c56c9"/></svg>
    <div class="row small muted" style="justify-content:space-between"><span>${fd(pts[0][0])}</span><span>ต่ำสุด ${mn.toFixed(2)} · สูงสุด ${mx.toFixed(2)}</span><span>${fd(pts[pts.length - 1][0])}</span></div>`;
}

async function syncLine(action='sync', auto=false){
  const L = db.line; if (!L.url || !/^https:\/\/script\.google\.com\//.test(L.url)) { if (!auto) toast('ใส่ Web App URL ของ Apps Script ก่อน', 'bad'); return; }
  if (!L.secret) { if (!auto) toast('ใส่รหัสลับ (SECRET) ก่อน', 'bad'); return; }
  if (!navigator.onLine) { if (!auto) toast('ออฟไลน์อยู่ จะซิงก์ให้เมื่อต่อเน็ต', 'bad'); return; }
  const p = linePayload(action), body = JSON.stringify(p), sig = action === 'sync' ? body.length + ':' + [...body].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) | 0, 7) : '';
  if (auto && sig === L.sig) return;
  try { await fetch(L.url, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body});
    if (action === 'sync') { L.sig = sig; L.lastSync = new Date().toISOString(); } saveRaw();

function drawDocFiles(){
  const el = $('#docFiles'); if (!el) return;
  el.innerHTML = pendingFiles.map((f, i) => `<div class="f" data-act="openFile" data-id="${f.id}">${f.kind === 'img' ? `<img data-fid="${f.id}" alt="">` : `📄<br>${esc((f.name || 'PDF').slice(0, 10))}`}<button type="button" class="rm" data-act="rmDocFile" data-i="${i}" aria-label="เอาออก">✕</button></div>`).join('');
  hydrate(el);
}
async function addDocFiles(list){
  for (const file of list) {
    try {
      const isImg = file.type.startsWith('image/');
      if (!isImg && file.size > 15e6) { toast('ไฟล์ใหญ่เกิน 15 MB', 'bad'); continue; }
      const data = isImg ? await compress(file) : await readURL(file), id = 'f_' + uid();
      await IDB.put(id, {data, name:file.name, type:isImg ? 'image/jpeg' : file.type}); cache.set(id, {data, name:file.name});
      pendingFiles.push({id, kind:isImg ? 'img' : 'pdf', name:file.name});
    } catch { toast('อ่านไฟล์ไม่ได้', 'bad'); }
  }
  drawDocFiles();
}

/* ============ BACKUP / ICS ============ */
function download(name, text, type){ const b = new Blob([text], {type}), u = URL.createObjectURL(b), a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 5000); }
async function exportData(){
  const files = {}; for (const d of db.docs) for (const f of d.files) { const v = await fileData(f.id); if (v) files[f.id] = v; }
  db.lastBackup = new Date().toISOString(); save();
  download(`studyabroad-backup-${todayIso()}.json`, JSON.stringify({app:'StudyAbroad', version:1, exportedAt:db.lastBackup, db, files}), 'application/json');
  render(); toast('สำรองข้อมูลแล้ว เก็บไฟล์ไว้ใน Google Drive ได้');
}
async function importData(file){
  let d; try { d = JSON.parse(await file.text()); } catch { toast('อ่านไฟล์ไม่ได้ ต้องเป็นไฟล์ .json จากแอปนี้', 'bad'); return; }
  if (!d || d.app !== 'StudyAbroad' || !d.db) { toast('ไฟล์นี้ไม่ใช่ข้อมูลสำรองของ StudyAbroad', 'bad'); return; }
  if (!confirm(`กู้คืนข้อมูลจากไฟล์วันที่ ${fd((d.exportedAt || '').slice(0, 10))}?\nข้อมูลในเครื่องตอนนี้จะถูกแทนที่ทั้งหมด`)) return;
  for (const [id, v] of Object.entries(d.files || {})) { try { await IDB.put(id, v); cache.set(id, v); } catch {} }
  db = Object.assign(blank(), d.db); if (!d.db.work && num(d.db.income) > 0) db.work.mode = 'manual'; db.sos = Object.assign(blankSos(), db.sos || {}); fixDb(); save(); ui.view = 'home'; render(); toast('กู้คืนข้อมูลแล้ว');
}
function exportIcs(){
  const ev = [], stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z', d8 = s => s.replace(/-/g, ''), escI = s => String(s || '').replace(/[\\,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const add = (id, date, title, desc, alarmDays) => ev.push(['BEGIN:VEVENT', `UID:${id}@studyabroad`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${d8(date)}`, `DTEND;VALUE=DATE:${d8(addDays(date, 1))}`, `SUMMARY:${escI(title)}`, desc ? `DESCRIPTION:${escI(desc)}` : '',
    ...(alarmDays !== undefined ? ['BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${escI(title)}`, `TRIGGER:-P${alarmDays}D`, 'END:VALARM'] : []), 'END:VEVENT'].filter(Boolean).join('\r\n'));
  for (const t of allTasks()) if (t.date && !t.done) add(t.id, t.date, '🎓 ' + t.t, t.x, 0);
  for (const d of db.docs) if (d.expiry) { add('exp_' + d.id, d.expiry, `⚠️ ${d.name || DOC_T[d.type][1]} หมดอายุ`, 'จาก StudyAbroad', d.type === 'passport' ? 180 : 30); }
  if (db.depart) { add('depart', db.depart, '✈️ วันเดินทาง', '', 1); add('end', endDate(), '🏁 จบแผน/กลับไทย', '', 30); }
  if (!ev.length) { toast('ยังไม่มีรายการที่มีวันที่', 'bad'); return; }
  download('studyabroad.ics', ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//StudyAbroad//TH', 'CALSCALE:GREGORIAN', ...ev, 'END:VCALENDAR'].join('\r\n'), 'text/calendar');
  toast('ได้ไฟล์ .ics แล้ว เปิดด้วย Google Calendar เพื่อเพิ่มการเตือน');
}

  addSchool:() => sheetSchool(null), editSchool:el => sheetSchool(el.dataset.id),
  useSchool:el => { applySchool(db.schools.find(x => x.id === el.dataset.id)); save(); render(); },

  addRoom:() => sheetRoom(null), editRoom:el => sheetRoom(el.dataset.id),

  delRoom:() => { if (!confirm('ลบห้องนี้?')) return; db.rooms = db.rooms.filter(x => x.id !== S.id); if (db.roomId === S.id) db.roomId = null; save(); closeSheet(); render(); },
  fxC:el => { ui.fxC = el.dataset.v; render(); },
  setTarget:() => { const v = num($('#fxTarget').value); if (!v) { toast('ใส่เรทเป้าหมาย', 'bad'); return; } db.rateTarget = {curr:ui.fxC || LC(), val:v}; save(); render(); toast('ตั้งเรทเป้าหมายแล้ว'); },
  clrTarget:() => { db.rateTarget = null; save(); render(); },
  lineSave:() => { const f = Object.fromEntries(new FormData($('#lineF'))); Object.assign(db.line, {url:(f.url || '').trim(), secret:(f.secret || '').trim(), on:!!f.on, sig:''}); saveRaw(); render(); toast('บันทึกแล้ว'); if (db.line.on) syncLine('sync', true); },
  lineTest:() => { A.lineSave(); syncLine('test'); }, lineSync:() => { db.line.sig = ''; syncLine('sync'); }, pickCountry:el => { db.country = el.dataset.v; db.city = Object.keys(COUNTRIES[db.country].cities)[0]; if (!COUNTRIES[db.country].visas[db.visa]?.ok) db.visa = 'student'; save(); sheetSetup(); },
  backup:() => { $('#menu').hidden = true; exportData(); }, restore:() => { $('#menu').hidden = true; $('#fileRestore').click(); }, ics:() => { $('#menu').hidden = true; exportIcs(); },

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!ev.target.closest('#menu') && !ev.target.closest('[data-act=menu]')) $('#menu').hidden = true;
  if (!el || el.tagName === 'SELECT') return;
  const f = A[el.dataset.act]; if (f) { if ((el.tagName === 'BUTTON' && el.type !== 'submit') || (el.tagName === 'A' && el.getAttribute('href') === '#')) ev.preventDefault(); f(el, ev); }
});
document.addEventListener('change', ev => {
  if (ev.target.matches('[data-act=setupCountry]')) { const code = ev.target.value; const keep = {visa:db.visa, city:db.city};
    db.city = Object.keys(COUNTRIES[code].cities)[0]; db.visa = COUNTRIES[code].visas[keep.visa]?.ok ? keep.visa : 'student';
    $('#setupDyn').innerHTML = setupDyn(code); db.city = keep.city; db.visa = keep.visa; }
});
document.addEventListener('input', ev => { if (ev.target.id === 'fxL' || ev.target.id === 'fxT') fxInput(ev.target); });

$('#fileRestore').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importData(f); };

load(); render();
